name: Dependency Review

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.repository == 'davidsantanaalves/luma-evolution'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
