name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      build_ipk:
        description: Build a verified webOS IPK as a validation artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quick-validation:
    name: Tooling checks
    if: >-
      github.repository == 'davidsantanaalves/luma-evolution' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && !inputs.build_ipk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm lint

  build-number:
    name: Number the validation build
    if: >-
      github.repository == 'davidsantanaalves/luma-evolution' && (github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.base_ref == 'develop')) && (github.event_name != 'workflow_dispatch' || inputs.build_ipk)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      number: ${{ steps.build.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Number this build
        id: build
        run: node tools/build-number.mjs

  prepare:
    name: Checks, unit tests, and shared desktop assets
    needs: build-number
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
        with:
          toolchain: '1.93.0'
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop
      # After the cache step, whose key comes from the unnumbered Cargo files.
      - name: Write the build's version
        env:
          LUMA_BUILD_NUMBER: ${{ needs.build-number.outputs.number }}
        run: node tools/build-number.mjs --apply
      - name: Install desktop and asset dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          # FontTools recommends large optional scientific Python packages. xauth is needed by xvfb-run.
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libsdl2-dev pkg-config woff2 python3-fonttools libgl1-mesa-dri xvfb xauth
      - name: Check formatting
        run: pnpm format:check
      - name: Lint Rust and packaging tools
        run: pnpm check
      - name: Run unit tests
        run: pnpm test
      - name: Generate native assets
        run: pnpm assets
      - name: Build shared desktop preview
        run: cargo build --locked --package luma --no-default-features
      - name: Bundle shared smoke inputs
        run: tar -czf smoke-inputs.tar.gz .build/assets target/debug/luma
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-inputs
          path: smoke-inputs.tar.gz
          retention-days: 1

  smoke:
    name: Smoke / ${{ matrix.suite }}
    needs: [build-number, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Navigation and rendering
            script: tests/smoke.mjs
            artifact: navigation
          - suite: Brand gallery
            script: tests/brands-smoke.mjs
            artifact: brands
          - suite: Mock weather
            script: tests/weather-smoke.mjs
            artifact: weather
          - suite: Translations
            script: tests/translations-smoke.mjs
            artifact: translations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suites read the app's version from package.json, so it must match the shared binary's.
      - name: Write the build's version
        env:
          LUMA_BUILD_NUMBER: ${{ needs.build-number.outputs.number }}
        run: node tools/build-number.mjs --apply
      - name: Install desktop rendering dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libsdl2-2.0-0 libgl1-mesa-dri xvfb xauth
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: smoke-inputs
      - run: tar -xzf smoke-inputs.tar.gz
      - name: Run isolated smoke suite
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LUMA_SMOKE_SKIP_BUILD: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node "${{ matrix.script }}"
      - name: Upload native rendering diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-rendering-${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
          path: |
            .build/*.png
            .build/*-render.json

  package:
    name: Verified ARM IPK and Homebrew feed
    if: >-
      github.repository == 'davidsantanaalves/luma-evolution' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.build_ipk
    needs: [build-number, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
        with:
          toolchain: '1.93.0'
          targets: armv7-unknown-linux-gnueabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: webos-${{ hashFiles('tools/build-webos.sh', 'tools/setup-webos-sdk.mjs', 'tools/webos-runtime.mjs') }}
      - name: Write the build's version
        env:
          LUMA_BUILD_NUMBER: ${{ needs.build-number.outputs.number }}
        run: node tools/build-number.mjs --apply
      - name: Install cross-build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends pkg-config
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: smoke-inputs
      - name: Restore generated native assets
        run: tar -xzf smoke-inputs.tar.gz .build/assets
      - name: Set up the webOS SDK
        run: pnpm sdk
      - name: Cross-build and verify the native IPK and Homebrew feed
        run: |
          export WEBOS_NDK="$GITHUB_WORKSPACE/.build/toolchain/arm-webos-linux-gnueabi_sdk-buildroot"
          pnpm build
          node tools/package.mjs
          node tools/repository.mjs
      - name: Upload IPK validation files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: luma-ipk-validation
          if-no-files-found: error
          path: |
            dist/*.ipk
            dist/sha256sums
            dist/repo.json
            dist/description.html
            dist/app-icon-large.png
